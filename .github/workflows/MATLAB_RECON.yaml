name: MATLAB Passive Endpoint Collector

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  passive-recon:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22' # Using stable version

      - name: Install Katana
        run: go install github.com/projectdiscovery/katana/cmd/katana@latest

      - name: Set Target and Headers
        run: |
          echo "TARGET=https://matlab.mathworks.com" >> "$GITHUB_ENV"
          # MathWorks requires this header for authorized testing
          echo "REQ_HEADER=X-Request-Purpose: BugcrowdResearch" >> "$GITHUB_ENV"

      - name: Notify Start
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -d "{\"content\":\"🔍 **MATLAB Passive Recon Started**\\n**Target:** $TARGET\\nCollecting JS endpoints for manual review.\"}" \
            "$WEBHOOK"

      - name: Crawl Target for Endpoints
        run: |
          # -jc: javascript crawl
          # -d 2: depth 2 (keeps it focused on the app, not external links)
          # -nc: no colors
          # -rl 1: rate limit 1 request per second (avoids DoS/WAF blocks)
          # -H: inject required Bugcrowd header
          katana -u "$TARGET" -jc -d 2 -nc -rl 1 -H "$REQ_HEADER" -o katana_crawl.txt

      - name: Extract API Endpoints
        run: |
          # Parse the crawl output to find interesting API paths for manual testing
          grep -oE '"/[a-zA-Z0-9_/.-]+"' katana_crawl.txt | sort -u > api_endpoints.txt
          
          ENDPOINT_COUNT=$(wc -l < api_endpoints.txt)
          echo "ENDPOINT_COUNT=$ENDPOINT_COUNT" >> "$GITHUB_ENV"

      - name: Notify Results
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -d "{\"content\":\"✅ **Recon Complete**\\n**Target:** $TARGET\\n**Endpoints Collected:** $ENDPOINT_COUNT\\nDownload artifacts from GitHub to begin manual testing.\"}" \
            "$WEBHOOK"

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: matlab-passive-recon
          path: |
            katana_crawl.txt
            api_endpoints.txt
          if-no-files-found: ignore
